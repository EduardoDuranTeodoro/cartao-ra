<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eduardo Duran Teodoro - Cartão RA</title>

    <!-- A-Frame (Versão 1.3.0 recomendada para MindAR) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <!-- MindAR para A-Frame (Versão 1.2.2 via CDN JSDelivr) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets/targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Cartão Profissional -->
      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- Bloco 1 (Topo): Nome e Área -->
        <a-plane
          position="0 0.35 0"
          scale="0.85 0.22 1"
          color="#1E293B"
          opacity="0.95"
        >
          <a-text
            value="Eduardo Duran Teodoro\nDesenvolvedor Back-end"
            align="center"
            width="1.6"
            color="#FFFFFF"
            position="0 0 0.01"
          ></a-text>
        </a-plane>

        <!-- Bloco 2 (Esquerda): Sobre Mim e Formação -->
        <a-plane
          position="-0.5 -0.02 0"
          rotation="0 10 0"
          scale="0.52 0.55 1"
          color="#0F172A"
          opacity="0.9"
        >
          <a-text
            value="SOBRE MIM\nEmpreendedor no ramo de limpeza\nautomotiva e operador na Bolsa.\nFoco em tecnologia e Agronomia.\n\nFORMACAO\n- ADS no SENAI\n- Futuro Eng. Agronomo"
            align="center"
            width="1.2"
            color="#38BDF8"
            position="0 0 0.01"
          ></a-text>
        </a-plane>

        <!-- Bloco 3 (Direita): Tecnologias e Habilidades -->
        <a-plane
          position="0.5 -0.02 0"
          rotation="0 -10 0"
          scale="0.52 0.55 1"
          color="#0F172A"
          opacity="0.9"
        >
          <a-text
            value="TECNOLOGIAS & TECH\n- HTML5 / CSS3 / JavaScript\n- React.js\n- Git & GitHub\n- Mercado Financeiro\n- Gestao de Negocios"
            align="center"
            width="1.2"
            color="#38BDF8"
            position="0 0 0.01"
          ></a-text>
        </a-plane>

        <!-- Bloco 4 (Base): Contato -->
        <a-plane
          position="0 -0.38 0"
          scale="0.85 0.16 1"
          color="#1E293B"
          opacity="0.95"
        >
          <a-text
            value="E-mail: eduardoduranteodoro@gmail.com"
            align="center"
            width="1.4"
            color="#38BDF8"
            position="0 0 0.01"
          ></a-text>
        </a-plane>

      </a-entity>
    </a-scene>

    <script src="js/app.js"></script>
  </body>
</html>
