<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eduardo Duran Teodoro - Cartão RA</title>

    <!-- A-Frame (Versão 1.3.0) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <!-- MindAR para A-Frame (Versão 1.2.2) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets/targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- Carrega a imagem exata do Canva -->
        <img id="meuCartao" src="./assets/images/cartao.png" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Quando reconhecer o cartão impresso/tela -->
      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- Renderiza a imagem do cartão com efeito 3D flutuante -->
        <a-plane
          src="#meuCartao"
          position="0 0 0.05"
          height="0.6"
          width="1.0"
          rotation="0 0 0"
        ></a-plane>

      </a-entity>
    </a-scene>

    <script src="js/app.js"></script>
  </body>
</html>
