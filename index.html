<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eduardo Duran Teodoro - Cartão RA</title>

    <!-- A-Frame (1.3.0) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <!-- MindAR para A-Frame (1.2.2) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets/targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Cartão Profissional -->
      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- Bloco 1 (Topo): Nome e Cargo -->
        <a-plane
          position="0 0.28 0"
          scale="0.65 0.18 1"
          color="#0F172A"
          opacity="0.95"
        >
          <a-text
            value="Eduardo Duran Teodoro\nDesenvolvedor Back-end"
            align="center"
            width="1.3"
            color="#FFFFFF"
            position="0 0 0.03"
          ></a-text>
        </a-plane>

        <!-- Bloco 2 (Esquerda): Sobre Mim -->
        <a-plane
          position="-0.38 0 0"
          rotation="0 10 0"
          scale="0.4 0.42 1"
          color="#1E293B"
          opacity="0.92"
        >
          <a-text
            value="SOBRE MIM\nEmpreendedor (Limpeza Auto)\nOperador no Mercado\nFoco em Tech e Agronomia\n\nFORMACAO\n- ADS no SENAI\n- Eng. Agronomo"
            align="center"
            width="1.0"
            color="#38BDF8"
            position="0 0 0.03"
          ></a-text>
        </a-plane>

        <!-- Bloco 3 (Direita): Tecnologias -->
        <a-plane
          position="0.38 0 0"
          rotation="0 -10 0"
          scale="0.4 0.42 1"
          color="#1E293B"
          opacity="0.92"
        >
          <a-text
            value="TECNOLOGIAS\n- HTML5 / CSS3 / JS\n- React.js\n- Git & GitHub\n- Mercado Financeiro\n- Gestao de Negocios"
            align="center"
            width="1.0"
            color="#38BDF8"
            position="0 0 0.03"
          ></a-text>
        </a-plane>

        <!-- Bloco 4 (Base): Contato -->
        <a-plane
          position="0 -0.28 0"
          scale="0.65 0.14 1"
          color="#0F172A"
          opacity="0.95"
        >
          <a-text
            value="eduardoduranteodoro@gmail.com"
            align="center"
            width="1.2"
            color="#38BDF8"
            position="0 0 0.03"
          ></a-text>
        </a-plane>

      </a-entity>
    </a-scene>

    <script src="js/app.js"></script>
  </body>
</html>
